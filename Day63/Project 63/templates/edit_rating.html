<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Rating</title>
</head>
<body>
    <h1>Edit Rating</h1>
    <p>Book Title: <strong>{{ book.title }}</strong></p>
    <p>Current Rating: {{ book.rating }}</p>

    <form action="{{ url_for('edit', id=book.id) }}" method="POST">
        <label>New Rating (e.g. 9.5):</label>
        <input type="number" step="0.1" name="rating" min="0" max="10" required>
        <button type="submit">Update Rating</button>
    </form>

    <br>
    <a href="{{ url_for('home') }}">Cancel and Go Back</a>
</body>
</html>
