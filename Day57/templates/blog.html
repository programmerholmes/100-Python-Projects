<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Blog</title>
</head>
<body>

    {% for post in posts: %}
        {% if post["id"] == 2: %}
            <h1>Blog title: {{ post["title"] }} </h1>
            <h2>Blog subtitle: {{ post["subtitle"] }} </h2>
        {% endif %}
    {% endfor %}
</body>
</html>
