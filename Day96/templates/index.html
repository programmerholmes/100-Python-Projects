{% extends "base.html" %}
{% block title %}Shop{% endblock %}
{% block content %}

<div class="hero text-center mb-5">
  <h1>Fine Art & Photo Prints</h1>
  <p class="text-muted">Museum-quality prints, shipped to your door.</p>
</div>

<div class="row g-4">
  {% for product in products %}
  <div class="col-sm-6 col-lg-3">
    <div class="card product-card h-100">
      <a href="{{ url_for('product', product_id=product.id) }}">
        <img src="{{ product.image }}" class="card-img-top" alt="{{ product.name }}">
      </a>
      <div class="card-body d-flex flex-column">
        <h5 class="card-title">{{ product.name }}</h5>
        <p class="card-text text-muted small flex-grow-1">{{ product.description }}</p>
        <div class="d-flex justify-content-between align-items-center mt-2">
          <span class="price">${{ '%.2f'|format(product.price) }}</span>
          <form method="post" action="{{ url_for('cart_add', product_id=product.id) }}">
            <input type="hidden" name="next" value="{{ url_for('index') }}">
            <button class="btn btn-sm btn-dark">Add to cart</button>
          </form>
        </div>
      </div>
    </div>
  </div>
  {% endfor %}
</div>

{% endblock %}
